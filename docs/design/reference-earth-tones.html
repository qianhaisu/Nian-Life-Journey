<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>张年 - 大地色+丝滑动效参考</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #F9F6F0; 
            color: #433E38; 
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
        }
        
        /* 定义优雅的进场动画 */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 导航栏 */
        header { 
            display: flex; justify-content: space-between; padding: 32px 64px; align-items: center; 
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        .logo { 
            width: 48px; height: 48px; background: #C2A88A; color: #FFF; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: bold; border-radius: 16px; 
            transition: transform 0.3s ease; 
        }
        .logo:hover { transform: scale(1.05) rotate(-5deg); }
        
        .nav-links { font-size: 15px; font-weight: 500; display: flex; gap: 32px; }
        .nav-links span { 
            color: #7A7267; cursor: pointer; position: relative; transition: color 0.3s;
        }
        .nav-links span:hover, .nav-links span.active { color: #433E38; }
        
        /* 导航条丝滑下划线动效 */
        .nav-links span::after {
            content: ''; position: absolute; bottom: -6px; left: 50%;
            width: 0; height: 3px; background-color: #9EAB92;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(-50%); border-radius: 2px;
        }
        .nav-links span:hover::after, .nav-links span.active::after { width: 100%; }

        /* 首屏主视觉 */
        .hero { padding: 100px 64px 80px; display: flex; justify-content: space-between; align-items: flex-end; }
        .hero-text { 
            font-size: 7vw; line-height: 1.15; font-weight: 800; letter-spacing: -1px; 
            opacity: 0; 
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards; /* 延迟 0.2s 出现 */
        }
        .highlight { color: #9EAB92; }
        .hero-date { 
            font-size: 14px; color: #8C847A; letter-spacing: 2px; 
            opacity: 0; 
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards; /* 延迟 0.4s 出现 */
        }
        
        /* 记忆模块布局 */
        .memory-section { display: flex; padding: 0 64px 120px 64px; height: 65vh; gap: 60px; }
        
        /* 照片悬浮动效 */
        .photo-placeholder { 
            flex: 1.2; background-color: #EFEBE4; border-radius: 32px; 
            display: flex; align-items: center; justify-content: center; 
            color: #AA9F91; font-size: 18px; 
            box-shadow: 0 16px 40px rgba(138, 121, 102, 0.08); 
            
            /* 动效过渡设置 */
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            cursor: pointer;
            
            /* 进场动画 */
            opacity: 0;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
        }
        
        /* 鼠标悬浮时：轻微上浮 + 阴影加深 + 微微放大 */
        .photo-placeholder:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 24px 48px rgba(138, 121, 102, 0.15);
        }
        
        .text-content { 
            flex: 0.8; display: flex; flex-direction: column; justify-content: center; 
            opacity: 0;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
        }
        .date-badge { 
            display: inline-block; background: #FFF; padding: 8px 16px; border-radius: 20px;
            font-size: 14px; color: #C2A88A; font-weight: bold; margin-bottom: 24px; width: fit-content;
            box-shadow: 0 4px 12px rgba(138, 121, 102, 0.05);
        }
        .memory-title { font-size: 36px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; color: #433E38; }
        .memory-desc { color: #7A7267; line-height: 1.8; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">年</div>
        <div class="nav-links">
            <span class="active">最近</span><span>成长线</span><span>关于张年</span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">最近怎么样，<br><span class="highlight">张年</span>。</div>
        <div class="hero-date">2026.08 / RECENTLY</div>
    </section>

    <section class="memory-section">
        <!-- 你可以用真实的 <img> 标签替换这个 div，把 class 保留即可 -->
        <div class="photo-placeholder">[ 这里放一张带有柔和光线的宝宝照片 ]</div>
        
        <div class="text-content">
            <div class="date-badge">1 岁 7 个月 · 8月28日</div>
            <div class="memory-title">吃着饭睡着了，<br>会说 ball 了。</div>
            <p class="memory-desc">这段时间的变化很快，吃饭着急会塞满嘴，开始随音乐舞动，也能在幼儿园毕业庆典上入选节目了。</p>
        </div>
    </section>

</body>
</html>
