<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>参考稿 · 首页（稀疏态：没有带照片的记忆时）</title><link rel="stylesheet" href="nl.css"></head>
<body>
<header class="hdr"><span class="mark">年</span><strong>Life is about a dream</strong><small>张年的人生档案</small></header>
<main>
  <div class="wrap">
    <!-- 没有 hero：封面变成纯排版。印章放大居中，那一句在下面。没有「暂无照片」。 -->
    <section class="reveal" style="padding:clamp(56px,12vw,120px) 0 0;text-align:center">
      <span class="stamp big"><b>1 岁 8 个月</b><span>2026 年 9 月</span></span>
      <h1 class="title" style="margin:28px auto 0;max-width:16ch"><a href="#">画画涂到脸上，吃饭香香</a></h1>
      <p class="quote" style="margin:18px auto 0">「吃饭香香。」</p>
      <p class="speaker" style="justify-content:center">奶奶 · 9 月 3 日</p>
    </section>

    <!-- 最近长大的一点：仍然只有一个 -->
    <section class="sec reveal">
      <span class="markline">最近长大的一点</span>
      <p class="quote" style="margin-top:10px">小年喊出了「粥粥」，发音很清楚。</p>
      <p class="dateline" style="margin-top:8px">9 月 2 日 · 老师转述</p>
    </section>

    <!-- 「最近的一组」没有照片 → 整块不渲染。 -->

    <!-- 本月：没有照片时只剩文字，色块仍成立 -->
    <a class="issue sec reveal" href="#">
      <span class="dateline">2026 年 9 月 · 本月</span>
      <p class="quote">英语课跟读单词，被老师夸了。</p>
      <span class="dateline">翻开这一期 →</span>
    </a>
  </div>
</main>
<nav class="bnav"><a class="on" href="#">首页</a><a href="#">记忆</a><a href="#">张年</a></nav>
</body></html>
